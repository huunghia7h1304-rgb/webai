<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N AI — Trợ lý thông minh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0a0b10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        .blob { position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.6; z-index: 0; animation: floatBlob 18s infinite alternate ease-in-out; }
        .blob-1 { width: 500px; height: 500px; background: #3b2f8f; top: -150px; left: -150px; animation-duration: 20s; }
        .blob-2 { width: 450px; height: 450px; background: #1f6e8c; bottom: -120px; right: -100px; animation-duration: 25s; animation-delay: -5s; }
        .blob-3 { width: 350px; height: 350px; background: #7b2d8e; top: 40%; left: 60%; animation-duration: 22s; animation-delay: -8s; opacity: 0.4; }
        @keyframes floatBlob { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,-40px) scale(1.15); } 100% { transform: translate(-40px,50px) scale(0.95); } }

        .app-container {
            position: relative; z-index: 10; width: 100%; max-width: 1150px; height: 92vh; max-height: 900px;
            background: rgba(18, 20, 30, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 42px; border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 70px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02) inset;
            display: flex; overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar { width: 280px; flex-shrink: 0; background: rgba(10,12,20,0.6); border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; }
        .sidebar-header { padding: 22px 20px 16px; display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg,#7f5af0,#2cb9e8); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #fff; box-shadow: 0 8px 20px rgba(127,90,240,0.3); animation: pulseGlow 3s infinite alternate; flex-shrink: 0; }
        @keyframes pulseGlow { 0% { box-shadow: 0 8px 20px rgba(127,90,240,0.3); } 100% { box-shadow: 0 8px 35px rgba(44,185,232,0.5); } }
        .logo-text { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg,#fff,#b8c7ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo-text span { font-weight: 300; -webkit-text-fill-color: #9aa4c4; }
        .new-chat-btn { margin: 0 16px 16px; padding: 14px 18px; background: linear-gradient(135deg,#7f5af0,#2cb9e8); border: none; border-radius: 16px; color: #fff; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.25s; box-shadow: 0 6px 18px rgba(127,90,240,0.35); }
        .new-chat-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(127,90,240,0.5); }
        .new-chat-btn:active { transform: scale(0.97); }
        .history-label { padding: 0 22px 10px; font-size: 11px; font-weight: 600; color: #5f678b; text-transform: uppercase; letter-spacing: 1.2px; }
        .history-list { flex: 1; overflow-y: auto; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 4px; }
        .history-list::-webkit-scrollbar { width: 5px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(127,90,240,0.3); border-radius: 20px; }
        .history-item { padding: 12px 14px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s; border: 1px solid transparent; }
        .history-item:hover { background: rgba(127,90,240,0.1); border-color: rgba(127,90,240,0.15); }
        .history-item.active { background: rgba(127,90,240,0.18); border-color: rgba(127,90,240,0.4); }
        .history-item i { color: #7f5af0; font-size: 14px; flex-shrink: 0; }
        .history-item-text { flex: 1; min-width: 0; font-size: 13px; color: #c5cde8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .history-item-time { font-size: 10px; color: #5f678b; flex-shrink: 0; }
        .history-item .delete-chat { opacity: 0; background: transparent; border: none; color: #ef4444; cursor: pointer; padding: 2px 4px; font-size: 12px; transition: opacity 0.2s; flex-shrink: 0; }
        .history-item:hover .delete-chat { opacity: 1; }
        .empty-history { text-align: center; color: #5f678b; font-size: 13px; padding: 30px 16px; line-height: 1.6; }
        .empty-history i { font-size: 28px; display: block; margin-bottom: 10px; opacity: 0.5; }

        /* MAIN */
        .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .app-header { padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .header-title { font-size: 16px; font-weight: 600; color: #e2e8f0; display: flex; align-items: center; gap: 10px; min-width: 0; }
        .header-title .current-chat-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #10b981; background: rgba(16,185,129,0.1); padding: 5px 12px; border-radius: 20px; font-weight: 600; border: 1px solid rgba(16,185,129,0.2); flex-shrink: 0; }
        .status-badge .dot { width: 7px; height: 7px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; animation: pulseDot 1.8s infinite; }
        @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .chat-container { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(127,90,240,0.4); border-radius: 20px; }

        .message { display: flex; gap: 14px; max-width: 88%; animation: fadeSlide 0.35s ease-out; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 38px; height: 38px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #fff; }
        .avatar.ai { background: linear-gradient(135deg,#7f5af0,#2cb9e8); box-shadow: 0 0 20px rgba(127,90,240,0.3); }
        .avatar.user-avatar { background: linear-gradient(135deg,#374151,#4b5563); }
        .bubble { padding: 14px 20px; border-radius: 22px; font-size: 15px; line-height: 1.6; color: #e2e8f0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); word-break: break-word; backdrop-filter: blur(6px); }
        .message.ai .bubble { background: rgba(127,90,240,0.12); border-color: rgba(127,90,240,0.2); border-bottom-left-radius: 6px; }
        .message.user .bubble { background: rgba(44,185,232,0.12); border-color: rgba(44,185,232,0.18); border-bottom-right-radius: 6px; }
        .timestamp { font-size: 11px; color: #5f678b; margin-top: 6px; letter-spacing: 0.3px; }

        /* ATTACHMENTS inside bubble */
        .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .attachment-img { max-width: 260px; max-height: 200px; border-radius: 12px; cursor: zoom-in; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); display: block; }
        .attachment-file {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px;
            background: rgba(0,0,0,0.25); border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            font-size: 13px; color: #c5cde8; max-width: 240px;
        }
        .attachment-file i { color: #7f5af0; }
        .attachment-file .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* INPUT AREA */
        .input-wrapper { padding: 14px 28px 20px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.15); }
        .preview-area { display: none; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        .preview-area.show { display: flex; }
        .preview-chip {
            position: relative; display: flex; align-items: center; gap: 8px;
            background: rgba(127,90,240,0.12); border: 1px solid rgba(127,90,240,0.3);
            border-radius: 12px; padding: 8px 30px 8px 10px; font-size: 12px; color: #c5cde8; max-width: 220px;
        }
        .preview-chip img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }
        .preview-chip .file-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: rgba(127,90,240,0.2); border-radius: 6px; color: #7f5af0; }
        .preview-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .preview-chip .remove { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); background: rgba(239,68,68,0.2); border: none; color: #ef4444; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }
        .preview-chip .remove:hover { background: rgba(239,68,68,0.4); }

        .input-row { display: flex; align-items: flex-end; gap: 12px; }
        .attach-btn {
            width: 58px; height: 58px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05); color: #b0b8d6; cursor: pointer; font-size: 20px;
            display: flex; align-items: center; justify-content: center; transition: all 0.25s; flex-shrink: 0;
        }
        .attach-btn:hover { background: rgba(127,90,240,0.2); border-color: rgba(127,90,240,0.5); color: #fff; transform: translateY(-2px); }
        .chat-input {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 16px 22px; font-family: inherit; font-size: 15px; color: #eef2ff;
            outline: none; transition: all 0.25s; resize: none; height: 58px; max-height: 140px;
        }
        .chat-input::placeholder { color: #5f678b; }
        .chat-input:focus { border-color: #7f5af0; background: rgba(127,90,240,0.06); box-shadow: 0 0 0 4px rgba(127,90,240,0.1); }
        .send-btn {
            background: linear-gradient(135deg,#7f5af0,#2cb9e8); border: none; color: #fff;
            width: 58px; height: 58px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; cursor: pointer; transition: all 0.25s; box-shadow: 0 6px 20px rgba(127,90,240,0.35); flex-shrink: 0;
        }
        .send-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 28px rgba(127,90,240,0.5); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.4; transform: none; box-shadow: none; cursor: not-allowed; }

        .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; color: #9aa4c4; text-align: center; padding: 20px; }
        .welcome i { font-size: 52px; background: linear-gradient(135deg,#7f5af0,#2cb9e8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; opacity: 0.7; }
        .welcome h2 { font-size: 24px; font-weight: 700; color: #eef2ff; letter-spacing: -0.5px; }
        .welcome p { font-size: 14px; max-width: 420px; line-height: 1.7; color: #7f8aa8; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(20,22,35,0.95); backdrop-filter: blur(12px); color: #eef2ff; padding: 14px 28px; border-radius: 60px; border: 1px solid rgba(127,90,240,0.4); box-shadow: 0 15px 40px rgba(0,0,0,0.6); font-size: 14px; font-weight: 500; z-index: 100; transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275); display: flex; align-items: center; gap: 10px; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast i { color: #10b981; }

        .typing-indicator { display: flex; align-items: center; gap: 5px; padding: 8px 4px; }
        .typing-indicator span { width: 7px; height: 7px; background: #7f5af0; border-radius: 50%; display: inline-block; animation: typingBounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

        .mobile-menu-btn { display: none; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #b0b8d6; width: 42px; height: 42px; border-radius: 14px; cursor: pointer; font-size: 18px; margin-right: 12px; flex-shrink: 0; }
        .sidebar-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
        .sidebar-overlay.show { display: block; }

        /* Lightbox */
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 95vw; max-height: 92vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }

        @media (max-width: 820px) {
            .app-container { height: 96vh; border-radius: 28px; }
            .sidebar { position: absolute; top: 0; left: 0; bottom: 0; z-index: 50; transform: translateX(-100%); box-shadow: 20px 0 60px rgba(0,0,0,0.7); background: rgba(14,16,26,0.98); backdrop-filter: blur(30px); }
            .sidebar.open { transform: translateX(0); }
            .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
            .app-header { padding: 16px 18px; }
            .chat-container { padding: 18px 16px; }
            .input-wrapper { padding: 12px 16px 16px; }
            .message { max-width: 96%; }
            .chat-input { height: 52px; padding: 12px 16px; font-size: 14px; }
            .send-btn, .attach-btn { width: 52px; height: 52px; font-size: 18px; }
            .status-badge { display: none; }
            .attachment-img { max-width: 200px; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="app-container">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">N</div>
                <div class="logo-text">N <span>AI</span></div>
            </div>
            <button class="new-chat-btn" id="newChatBtn"><i class="fas fa-plus"></i> Trò chuyện mới</button>
            <div class="history-label">Lịch sử trò chuyện</div>
            <div class="history-list" id="historyList"></div>
        </aside>

        <div class="main-area">
            <div class="app-header">
                <div style="display:flex;align-items:center;min-width:0;flex:1;">
                    <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
                    <div class="header-title">
                        <i class="fas fa-comment-dots" style="color:#7f5af0;"></i>
                        <span class="current-chat-name" id="currentChatName">Cuộc trò chuyện mới</span>
                    </div>
                </div>
                <div class="status-badge"><span class="dot"></span><span>Đang hoạt động</span></div>
            </div>

            <div class="chat-container" id="chatContainer">
                <div class="welcome" id="welcomeScreen">
                    <i class="fas fa-comment-dots"></i>
                    <h2>Xin chào, mình là N AI</h2>
                    <p>Mình có thể giúp bạn giải đáp thắc mắc, viết nội dung, lập trình, <b>phân tích ảnh</b> và <b>đọc tập tin</b>. Hãy bắt đầu trò chuyện!</p>
                </div>
            </div>

            <div class="input-wrapper">
                <div class="preview-area" id="previewArea"></div>
                <div class="input-row">
                    <button class="attach-btn" id="attachBtn" title="Đính kèm tập tin/ảnh">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <textarea id="messageInput" class="chat-input" placeholder="Nhập tin nhắn..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn"><i class="fas fa-arrow-up"></i></button>
                </div>
                <input type="file" id="fileInput" style="display:none;" multiple accept="image/*,text/*,.pdf,.json,.csv,.md,.js,.py,.html,.css,.xml,.yaml,.yml,.log,.doc,.docx">
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">Thông báo</span></div>
    <div class="lightbox" id="lightbox"><img id="lightboxImg" alt="preview"></div>

    <script>
        (function() {
            // ============================================================
            // CẤU HÌNH API
            // ============================================================
            const API_KEY = 'AQ.Ab8RN6KxyRrW5vt8ClzP9R2w3a1HRpNR6UP7qkCx-gwb3sS3aw'; 
            const API_URL = 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions';
            const MODEL = 'gemini-3.5-flash'; 
            // ============================================================

            const chatContainer = document.getElementById('chatContainer');
            const welcomeScreen = document.getElementById('welcomeScreen');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const newChatBtn = document.getElementById('newChatBtn');
            const historyList = document.getElementById('historyList');
            const currentChatName = document.getElementById('currentChatName');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const attachBtn = document.getElementById('attachBtn');
            const fileInput = document.getElementById('fileInput');
            const previewArea = document.getElementById('previewArea');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');

            let conversations = [];
            let currentChatId = null;
            let isProcessing = false;
            let pendingFiles = [];

            // ===== PERSISTENCE =====
            function saveState() {
                localStorage.setItem('n_ai_conversations', JSON.stringify(conversations));
                localStorage.setItem('n_ai_current_chat', currentChatId || '');
            }
            function loadState() {
                try {
                    const saved = localStorage.getItem('n_ai_conversations');
                    if (saved) conversations = JSON.parse(saved);
                    if (!Array.isArray(conversations)) conversations = [];
                } catch { conversations = []; }
                currentChatId = localStorage.getItem('n_ai_current_chat') || null;
                if (currentChatId && !conversations.find(c => c.id === currentChatId)) currentChatId = null;
            }

            // ===== HELPERS =====
            function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
            function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
            function formatTime(date) {
                const d = new Date(date), now = new Date(), diff = (now - d)/1000;
                if (diff < 60) return 'Vừa xong';
                if (diff < 3600) return Math.floor(diff/60) + ' phút trước';
                if (diff < 86400) return Math.floor(diff/3600) + ' giờ trước';
                if (diff < 604800) return Math.floor(diff/86400) + ' ngày trước';
                return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
            }
            function formatClock(date) { return new Date(date).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); }
            function showToast(msg) {
                toastMessage.textContent = msg;
                toast.classList.add('show');
                clearTimeout(window._toastTimer);
                window._toastTimer = setTimeout(()=>toast.classList.remove('show'), 2400);
            }
            function getCurrentChat() { return conversations.find(c => c.id === currentChatId) || null; }

            // ===== HISTORY =====
            function renderHistory() {
                if (!conversations.length) {
                    historyList.innerHTML = `<div class="empty-history"><i class="fas fa-comments"></i>Chưa có cuộc trò chuyện nào.</div>`;
                    return;
                }
                const sorted = [...conversations].sort((a,b)=>b.updatedAt - a.updatedAt);
                historyList.innerHTML = sorted.map(conv => {
                    const isActive = conv.id === currentChatId;
                    const title = conv.title || 'Cuộc trò chuyện mới';
                    return `<div class="history-item ${isActive?'active':''}" data-id="${conv.id}">
                        <i class="fas fa-comment"></i>
                        <span class="history-item-text" title="${escapeHtml(title)}">${escapeHtml(title)}</span>
                        <span class="history-item-time">${formatTime(conv.updatedAt)}</span>
                        <button class="delete-chat" data-delete="${conv.id}" title="Xóa"><i class="fas fa-trash"></i></button>
                    </div>`;
                }).join('');
                historyList.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', e => {
                        if (e.target.closest('.delete-chat')) return;
                        switchChat(el.dataset.id);
                    });
                });
                historyList.querySelectorAll('.delete-chat').forEach(btn => {
                    btn.addEventListener('click', e => { e.stopPropagation(); deleteChat(btn.dataset.delete); });
                });
            }
            function switchChat(id) {
                if (isProcessing) { showToast('Vui lòng đợi AI trả lời xong.'); return; }
                currentChatId = id; saveState(); renderHistory(); renderChat(); closeSidebarMobile();
            }
            function deleteChat(id) {
                if (!confirm('Xóa cuộc trò chuyện này?')) return;
                conversations = conversations.filter(c => c.id !== id);
                if (currentChatId === id) currentChatId = conversations.length ? conversations[0].id : null;
                saveState(); renderHistory(); renderChat(); showToast('Đã xóa.');
            }
            function createNewChat() {
                if (isProcessing) { showToast('Vui lòng đợi AI trả lời xong.'); return; }
                const cur = getCurrentChat();
                if (cur && cur.messages.length === 0) { showToast('Bạn đang ở cuộc trò chuyện mới rồi!'); closeSidebarMobile(); return; }
                const newConv = { id: generateId(), title: 'Cuộc trò chuyện mới', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
                conversations.push(newConv); currentChatId = newConv.id;
                saveState(); renderHistory(); renderChat(); closeSidebarMobile(); messageInput.focus();
            }

            // ===== RENDER CHAT =====
            function renderChat() {
                chatContainer.innerHTML = '';
                const chat = getCurrentChat();
                if (!chat || chat.messages.length === 0) {
                    chatContainer.appendChild(welcomeScreen);
                    welcomeScreen.style.display = 'flex';
                    currentChatName.textContent = chat ? (chat.title || 'Cuộc trò chuyện mới') : 'Cuộc trò chuyện mới';
                    return;
                }
                currentChatName.textContent = chat.title || 'Cuộc trò chuyện mới';
                chat.messages.forEach(msg => appendMessageToUI(msg, false));
                scrollToBottom();
            }

            function renderAttachments(attachments) {
                if (!attachments || !attachments.length) return '';
                return `<div class="attachments">` + attachments.map(att => {
                    if (att.isImage && att.dataUrl) {
                        return `<img class="attachment-img" src="${att.dataUrl}" data-img="${att.dataUrl}" alt="ảnh">`;
                    }
                    return `<div class="attachment-file"><i class="fas fa-file"></i><span class="name">${escapeHtml(att.name)}</span></div>`;
                }).join('') + `</div>`;
            }

            function appendMessageToUI(msg, animate = true) {
                const welcome = document.getElementById('welcomeScreen');
                if (welcome) welcome.style.display = 'none';

                const role = msg.role;
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role === 'user' ? 'user' : 'ai'}`;

                const avatarDiv = document.createElement('div');
                avatarDiv.className = `avatar ${role === 'user' ? 'user-avatar' : 'ai'}`;
                avatarDiv.innerHTML = role === 'user' ? '<i class="fas fa-user"></i>' : 'N';

                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'bubble';
                let inner = '';
                if (msg.attachments) inner += renderAttachments(msg.attachments);
                if (msg.content) inner += escapeHtml(msg.content).replace(/\n/g,'<br>');
                bubbleDiv.innerHTML = inner;

                const timestampDiv = document.createElement('div');
                timestampDiv.className = 'timestamp';
                timestampDiv.textContent = formatClock(msg.time || Date.now());

                const textWrapper = document.createElement('div');
                textWrapper.style.display = 'flex';
                textWrapper.style.flexDirection = 'column';
                textWrapper.style.gap = '4px';
                textWrapper.appendChild(bubbleDiv);
                textWrapper.appendChild(timestampDiv);

                messageDiv.appendChild(avatarDiv);
                messageDiv.appendChild(textWrapper);
                if (!animate) messageDiv.style.animation = 'none';
                chatContainer.appendChild(messageDiv);

                bubbleDiv.querySelectorAll('.attachment-img').forEach(img => {
                    img.addEventListener('click', () => {
                        lightboxImg.src = img.dataset.img;
                        lightbox.classList.add('show');
                    });
                });
                scrollToBottom();
            }

            function scrollToBottom() { chatContainer.scrollTop = chatContainer.scrollHeight; }

            function showTypingIndicator() {
                const typingDiv = document.createElement('div');
                typingDiv.className = 'message ai'; typingDiv.id = 'typingIndicator';
                typingDiv.innerHTML = `<div class="avatar ai">N</div>
                    <div class="bubble" style="padding:12px 20px;">
                        <div class="typing-indicator"><span></span><span></span><span></span></div>
                    </div>`;
                chatContainer.appendChild(typingDiv);
                scrollToBottom();
            }
            function removeTypingIndicator() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }

            // ===== FILE ATTACH =====
            function readFileAsDataURL(file) {
                return new Promise((resolve, reject) => {
                    const r = new FileReader();
                    r.onload = () => resolve(r.result);
                    r.onerror = reject;
                    r.readAsDataURL(file);
                });
            }
            function readFileAsText(file) {
                return new Promise((resolve, reject) => {
                    const r = new FileReader();
                    r.onload = () => resolve(r.result);
                    r.onerror = reject;
                    r.readAsText(file);
                });
            }

            attachBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', async (e) => {
                const files = Array.from(e.target.files);
                for (const file of files) {
                    if (file.size > 15 * 1024 * 1024) { showToast(`${file.name} quá lớn (>15MB)`); continue; }
                    const isImage = file.type.startsWith('image/');
                    let dataUrl = null, textContent = null;
                    try {
                        if (isImage) {
                            dataUrl = await readFileAsDataURL(file);
                        } else {
                            const textLike = /^text\/|\.(txt|md|json|csv|js|py|html|css|xml|yaml|yml|log)$/i.test(file.name) || file.type.startsWith('text/');
                            if (textLike && file.size < 500 * 1024) {
                                textContent = await readFileAsText(file);
                            }
                            dataUrl = await readFileAsDataURL(file);
                        }
                        pendingFiles.push({
                            file, dataUrl, textContent, isImage,
                            name: file.name, mime: file.type || 'application/octet-stream'
                        });
                    } catch (err) {
                        showToast('Không đọc được: ' + file.name);
                    }
                }
                fileInput.value = '';
                renderPreview();
            });

            function renderPreview() {
                if (!pendingFiles.length) { previewArea.classList.remove('show'); previewArea.innerHTML = ''; return; }
                previewArea.classList.add('show');
                previewArea.innerHTML = pendingFiles.map((p, i) => `
                    <div class="preview-chip">
                        ${p.isImage
                            ? `<img src="${p.dataUrl}" alt="">`
                            : `<div class="file-icon"><i class="fas fa-file"></i></div>`}
                        <span class="name">${escapeHtml(p.name)}</span>
                        <button class="remove" data-idx="${i}"><i class="fas fa-times"></i></button>
                    </div>`).join('');
                previewArea.querySelectorAll('.remove').forEach(btn => {
                    btn.addEventListener('click', () => {
                        pendingFiles.splice(parseInt(btn.dataset.idx), 1);
                        renderPreview();
                    });
                });
            }

            // ===== SEND =====
            async function sendMessage() {
                const content = messageInput.value.trim();
                if ((!content && !pendingFiles.length) || isProcessing) return;

                let chat = getCurrentChat();
                if (!chat) {
                    chat = { id: generateId(), title: 'Cuộc trò chuyện mới', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
                    conversations.push(chat); currentChatId = chat.id;
                }
                if (chat.messages.length === 0) {
                    const t = content || (pendingFiles[0]?.name || 'Tệp đính kèm');
                    chat.title = t.slice(0, 40) + (t.length > 40 ? '…' : '');
                }

                const attachments = pendingFiles.map(p => ({
                    name: p.name, mime: p.mime, isImage: p.isImage,
                    dataUrl: p.dataUrl, textContent: p.textContent
                }));

                const userMsg = { role: 'user', content, time: Date.now(), attachments };
                chat.messages.push(userMsg);
                chat.updatedAt = Date.now();

                messageInput.value = '';
                messageInput.style.height = 'auto';
                pendingFiles = [];
                renderPreview();

                renderHistory();
                currentChatName.textContent = chat.title;
                appendMessageToUI(userMsg, true);

                isProcessing = true;
                sendBtn.disabled = true;
                showTypingIndicator();

                try {
                    const reply = await callAI(chat.messages);
                    removeTypingIndicator();
                    const aiMsg = { role: 'assistant', content: reply, time: Date.now() };
                    chat.messages.push(aiMsg);
                    chat.updatedAt = Date.now();
                    saveState();
                    appendMessageToUI(aiMsg, true);
                    renderHistory();
                } catch (err) {
                    removeTypingIndicator();
                    const errMsg = `⚠️ Lỗi: ${err.message || 'Không thể kết nối API.'}`;
                    appendMessageToUI({ role: 'assistant', content: errMsg, time: Date.now() }, true);
                    showToast(err.message || 'Có lỗi xảy ra');
                } finally {
                    isProcessing = false;
                    sendBtn.disabled = false;
                    messageInput.focus();
                }
            }

            // ===== BUILD MESSAGES cho API =====
            function buildApiMessages(messages) {
                const recent = messages.slice(-12);
                const out = [{
                    role: 'system',
                    content: 'Bạn là N AI, trợ lý thông minh thân thiện. Trả lời bằng tiếng Việt trừ khi được yêu cầu khác. Ngắn gọn, súc tích. Nếu người dùng gửi ảnh, hãy mô tả và phân tích nội dung ảnh. Nếu gửi tệp văn bản, hãy đọc nội dung và trả lời dựa trên đó.'
                }];

                for (const m of recent) {
                    if (m.role === 'assistant') {
                        out.push({ role: 'assistant', content: m.content || '' });
                        continue;
                    }
                    const parts = [];
                    if (m.content) parts.push({ type: 'text', text: m.content });

                    if (m.attachments && m.attachments.length) {
                        for (const att of m.attachments) {
                            if (att.isImage && att.dataUrl) {
                                parts.push({ type: 'image_url', image_url: { url: att.dataUrl } });
                            } else if (att.textContent) {
                                parts.push({ type: 'text', text: `\n\n[Nội dung tệp: ${att.name}]\n${att.textContent}\n[Hết tệp]` });
                            } else {
                                parts.push({ type: 'text', text: `\n\n[Người dùng đã đính kèm tệp: ${att.name} (${att.mime}) — nội dung không đọc được trực tiếp]` });
                            }
                        }
                    }

                    if (parts.length === 0) parts.push({ type: 'text', text: '(không có nội dung)' });
                    if (parts.length === 1 && parts[0].type === 'text') {
                        out.push({ role: 'user', content: parts[0].text });
                    } else {
                        out.push({ role: 'user', content: parts });
                    }
                }
                return out;
            }

            // ===== API CALL =====
            async function callAI(messages) {
                // ĐÃ SỬA: Chỉ kiểm tra key có tồn tại hay không, bỏ qua việc kiểm tra chuỗi con gây lỗi
                if (!API_KEY || API_KEY.trim() === '') {
                    throw new Error('Vui lòng cấu hình API_KEY trong code.');
                }
                
                const payload = {
                    model: MODEL,
                    messages: buildApiMessages(messages),
                    temperature: 0.7,
                    max_tokens: 2000
                };
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error?.message || `HTTP ${res.status}`);
                }
                const data = await res.json();
                const reply = data.choices?.[0]?.message?.content;
                if (!reply) throw new Error('Không nhận được phản hồi từ API.');
                return reply.trim();
            }

            // ===== MOBILE =====
            function openSidebarMobile() { sidebar.classList.add('open'); sidebarOverlay.classList.add('show'); }
            function closeSidebarMobile() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('show'); }
            mobileMenuBtn.addEventListener('click', () => {
                if (sidebar.classList.contains('open')) closeSidebarMobile(); else openSidebarMobile();
            });
            sidebarOverlay.addEventListener('click', closeSidebarMobile);

            // ===== LIGHTBOX =====
            lightbox.addEventListener('click', () => lightbox.classList.remove('show'));

            // ===== EVENTS =====
            sendBtn.addEventListener('click', sendMessage);
            newChatBtn.addEventListener('click', createNewChat);
            messageInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });
            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
            });
            messageInput.addEventListener('paste', async (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const blob = item.getAsFile();
                        if (!blob) continue;
                        const dataUrl = await readFileAsDataURL(blob);
                        pendingFiles.push({
                            file: blob, dataUrl, textContent: null, isImage: true,
                            name: 'clipboard-image.png', mime: blob.type
                        });
                        renderPreview();
                    }
                }
            });

            // ===== INIT =====
            loadState();
            if (conversations.length === 0) {
                const firstChat = { id: generateId(), title: 'Cuộc trò chuyện mới', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
                conversations.push(firstChat);
                currentChatId = firstChat.id;
                saveState();
            } else if (!currentChatId) {
                currentChatId = conversations[0].id;
            }
            renderHistory();
            renderChat();
            messageInput.focus();
            setInterval(renderHistory, 60000);
        })();
    </script>
</body>
</html>
